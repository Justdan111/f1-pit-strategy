[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "justdan111", email = "emmanuelngulube292@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode = "auto" means an `async def test_...` just runs, with no
# per-test decorator. Most of this codebase is async; requiring a marker on
# every test would be noise that obscures what each test actually asserts.
asyncio_mode = "auto"
addopts = "-q --strict-markers"
