# Render Blueprint — infrastructure as code, so the deployment is reviewable
# in the repo rather than living only as dashboard clicks somebody has to
# remember. Render reads this on "New > Blueprint".
services:
  - type: web
    name: f1-pit-strategy-backend
    # THE POINT OF DAY 5: `docker`, not Render's auto-detected Python
    # buildpack. The buildpack would detect pyproject.toml and guess a start
    # command; this runs the exact image verified locally.
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: F1_OPENF1_BASE_URL
        value: https://api.openf1.org/v1
      # sync: false means "prompt me, do not store it here". The frontend's
      # deployed origin is not known until Vercel has deployed, and it does
      # not belong in version control.
      - key: F1_ALLOWED_ORIGINS
        sync: false
      # Comma-separated keys required on the WebSocket. Leaving this unset
      # leaves the stream open to anyone.
      - key: F1_API_KEYS
        sync: false
      # The decision log lives on the container filesystem, which the free
      # plan wipes on every deploy and every spin-down. It is useful for
      # reviewing a race just watched, not for keeping a history. A mounted
      # disk (paid) or a hosted database would be needed for that.
      # The image defaults this to /data/decisions.db, writable by the
      # non-root user. On the free plan that directory is still wiped on
      # every deploy and spin-down; mounting a disk at /data makes it
      # durable.
      - key: F1_DECISION_LOG_PATH
        value: /data/decisions.db
